name: Release

# Duas portas para o mesmo destino:
#  1) push de tag anotada v* (quando criada localmente com permissão de tags);
#  2) workflow_dispatch com input `version` — o job cria a tag E a Release,
#     com notas lidas de releases/<version>.md (fonte única versionada).
# A Release dispara o webhook do Zenodo -> DOI de versão.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a lançar (ex.: v0.62.0); precisa de releases/<version>.md"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            test -f "releases/${V}.md" || { echo "releases/${V}.md ausente"; exit 1; }
            gh release create "$V" --target "${GITHUB_SHA}" \
              --title "$V — Engenharia de Harness" --notes-file "releases/${V}.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME} — Engenharia de Harness" \
              --notes-from-tag --verify-tag
          fi
