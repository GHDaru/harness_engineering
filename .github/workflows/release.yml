name: Release

# Release dirigida por ARQUIVO (a porta que funciona do agente): commitar
# releases/vX.Y.Z.md na main cria a tag vX.Y.Z e a Release com essas notas,
# se ainda não existirem (idempotente). Porta extra: workflow_dispatch pela UI.
# A Release dispara o webhook do Zenodo -> DOI de versão.

on:
  push:
    branches: [main]
    paths: ["releases/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a lançar (ex.: v0.62.0); precisa de releases/<version>.md"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar Releases pendentes (uma por releases/v*.md sem release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LISTA="releases/${{ inputs.version }}.md"
          else
            LISTA=$(ls releases/v*.md 2>/dev/null || true)
          fi
          for f in $LISTA; do
            V=$(basename "$f" .md)
            if gh release view "$V" >/dev/null 2>&1; then
              echo "já existe: $V"
            else
              gh release create "$V" --target "${GITHUB_SHA}" \
                --title "$V — Engenharia de Harness" --notes-file "$f"
              echo "criada: $V"
            fi
          done
