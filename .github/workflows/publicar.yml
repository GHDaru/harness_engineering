name: Publicar o livro

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica em
# harness.ghdaru.com.br a cada push no main. O docs/ é gerado pelo CI, não
# versionado. Um endereço só, desde a spec 095.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "benchmark/**"
      - "harness-um/**"
      - "radar/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: write   # spec 077: o CI commita o corpus regenerado do companion
  # spec 095: `pages` e `id-token` saíram junto com a publicação no Pages.

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # spec 091: o endereco proprio. Alimenta canonical, hreflang, og:image e o
    # rodape dos PDFs -- 428 ocorrencias, todas derivadas daqui (spec 089).
    # Trocar de hospedagem outra vez e mudar ESTA linha, nada de codigo.
    env:
      SITE_URL: https://harness.ghdaru.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do harness-um (a referência não pode apodrecer)
        run: pip install -q -e ".[dev]" && python -m pytest tests/ -q
        working-directory: harness-um
      # spec 094: os guarda-corpos de `.claude/hooks/` impõem por máquina o que os
      # Princípios IV e VI pediam por escrito — segredo e identificador interno de
      # modelo fora dos artefatos. Um hook sem teste é uma promessa com sintaxe;
      # este passo é o que impede que ele apodreça em silêncio.
      - name: Testes dos guarda-corpos
        run: python -m pytest .claude/hooks/tests/ -q
      # Sensor barato à esquerda (cap. 11). Esta spec DECLARA o padrão; conformar
      # o código existente é trabalho de outra (spec 094, R4). Por isso o passo
      # reporta e não bloqueia — virar portão é decisão de uma spec futura, e
      # anunciá-la aqui evita que alguém a ligue por engano num dia de pressa.
      - name: Lint (Ruff, informativo)
        run: pipx run ruff check . || true
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build
        working-directory: publicar
      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capitulo)
        run: npm run pdf
        working-directory: publicar
      # spec 077: o corpus do tutor inclui o Radar, que muda todo dia — e o agente
      # do Radar so escreve em radar/. Sem isto o companion responderia sempre
      # com um dia de atraso. Commita so se mudou; corpus.json nao esta nos paths
      # do gatilho, entao este push nao re-dispara o workflow.
      - name: Regenerar corpus do companion
        run: python3 build_corpus.py
        working-directory: chat-companion/backend
      - name: Commitar corpus se mudou
        run: |
          if [ -n "$(git status --porcelain chat-companion/backend/corpus.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add chat-companion/backend/corpus.json
            git commit -m "corpus: regenerado pelo CI"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "corpus inalterado"
          fi
      - name: Limpar temporario de impressao
        run: rm -f docs/_print.html docs/en/_print.html

      # spec 090: publicacao no Vercel. Nasceu em paralelo ao Pages durante a
      # transicao; desde a spec 095 e o unico canal. ATE A SPEC 106 este passo era
      # INERTE sem o secret `VERCEL_TOKEN`; agora ele REPROVA, porque publicacao
      # que nao acontece precisa de vermelho e nao de silencio.
      #
      # Por que --prebuilt: docs/ e GERADO e esta no .gitignore. Um projeto
      # conectado ao git tentaria construir e nao acharia nada. Aqui o Actions
      # constroi (e onde o Chromium dos PDFs funciona) e o Vercel so distribui.
      # O formato e o Build Output API v3: .vercel/output/static/ + config.json.
      # spec 104: `set -o pipefail` e o `if !` nao sao estilo, sao o conserto.
      #
      # Em 13/ago o `vercel deploy` foi recusado por cota ("more than 100, code:
      # api-deployments-free-per-day"), o site ficou na versao anterior, e o passo
      # reportou VERDE. O shell padrao de `run:` e `bash -e`, SEM pipefail: o codigo
      # de saida de um pipeline e o do ultimo comando, e o ultimo era o `tee`, que
      # gravou a mensagem de erro com sucesso. Pior, a linha seguinte escrevia
      # "Publicado no Vercel" no resumo e colava o texto do erro como se fosse a URL.
      # O `tee` existia para mostrar a URL; acabou transformando uma falha de
      # publicacao numa afirmacao de publicacao. Quem achou foi o editor, abrindo o
      # site -- nao o processo.
      # spec 106: a condicao `if: env.VERCEL_TOKEN != ''` saiu daqui. Ela fazia o
      # passo se AUSENTAR quando o segredo faltasse, e passo ausente nao reprova
      # job -- entao perder o token de publicacao daria verde e o site pararia de
      # atualizar em silencio. Agora falta de token e vermelho, com a razao dita.
      - name: Publicar no Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::o segredo VERCEL_TOKEN esta ausente ou vazio -- a publicacao NAO aconteceu e o site segue na versao anterior. Configure o segredo em Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm install -g vercel@latest
          mkdir -p .vercel/output/static
          cp -r docs/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json
          # O nome tem hifen: nome de projeto no Vercel nao aceita sublinhado.
          # `link` cria o projeto se ele ainda nao existir -- e assim que ele nasce.
          vercel link --yes --project harness-engineering --token="$VERCEL_TOKEN"
          if ! vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /tmp/vercel-url.txt; then
            echo "::error::deploy recusado pelo Vercel -- o site SEGUE NA VERSAO ANTERIOR. Se a mensagem for api-deployments-free-per-day, a cota diaria do plano gratuito estourou e o proximo deploy aceito publica o conteudo que ja esta na main."
            exit 1
          fi
          echo "### Publicado no Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -1 /tmp/vercel-url.txt)" >> "$GITHUB_STEP_SUMMARY"
      # O pipefail acima pega o deploy que falha em voz alta. NAO pega o deploy que
      # "sucede" sem trocar o conteudo -- e a distincao do anti-checklist: build
      # verde nao e pagina correta. Por isso este passo pergunta a coisa que
      # interessa: a pagina no ar e a que este build gerou?
      #
      # O carimbo comparado e o COMMIT (docs/build.json, escrito por carimbo.mjs),
      # nao a edicao do HISTORICO. A diferenca decide: um commit do Radar nao muda a
      # edicao, e a falha de 13/ago foi num commit do Radar -- uma conferencia por
      # edicao teria passado verde exatamente na falha que a motivou.
      # spec 106: esta conferencia NUNCA RODOU. Ela carregava
      # `if: env.VERCEL_TOKEN != ''`, copiado do passo de publicacao, mas
      # VERCEL_TOKEN so existe no `env:` DAQUELE passo -- aqui a variavel nao
      # esta no escopo, a condicao dava falso, e o passo saia `skipped` em toda
      # execucao desde a spec 104. Passo pulado nao reprova job, entao o verde
      # continuou verde e eu cheguei a relatar que ele "aprovou por merito".
      # A conferencia usa o endereco publico e o GITHUB_SHA; nunca precisou do
      # token. Sem condicao.
      - name: Conferir que o site publicado e o que se construiu
        env:
          SITE_URL: ${{ env.SITE_URL || 'https://harness.ghdaru.com.br' }}
        shell: bash
        run: |
          set -o pipefail
          echo "commit construido: $GITHUB_SHA"
          for tentativa in 1 2 3 4 5; do
            publicado="$(curl -fsS "$SITE_URL/build.json" | grep -oE '[0-9a-f]{40}' | head -1 || true)"
            echo "tentativa $tentativa -- commit publicado: ${publicado:-<sem resposta>}"
            if [ "$publicado" = "$GITHUB_SHA" ]; then
              echo "✓ o site no ar serve o commit deste build"; exit 0
            fi
            sleep $((tentativa * 10))
          done
          echo "::error::o deploy passou mas o site serve o commit '${publicado:-desconhecido}' e este build gerou '$GITHUB_SHA' -- a publicacao nao trocou o conteudo."
          exit 1
      # spec 095: os passos do GitHub Pages saíram daqui.
      #
      # O motivo não é preferência de hospedagem — é que havia DUAS cópias vivas e
      # idênticas do livro no ar, e a spec 089 tinha decidido, com dado, abandonar
      # o endereço antigo. Decidir não é executar: o passo do Vercel foi
      # acrescentado (spec 090) e o do Pages nunca foi retirado, então cada
      # execução publicava nos dois.
      #
      # O `docs/` continua sendo construído, verificado e usado para os PDFs. O que
      # saiu foi a DISTRIBUIÇÃO por um segundo canal, não a construção.
      #
      # ⚠️ Isto faz o Pages parar de RECEBER atualização; a última versão publicada
      # continua servida até o editor desligar em Settings → Pages (fechar o
      # repositório também resolve: Pages de repo privado exige plano pago).

