name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build
        working-directory: publicar
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
