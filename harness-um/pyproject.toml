[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-um"
version = "0.1.0"
description = "A implementação de referência do livro Engenharia de Harness: todas as features dos capítulos 02–13, na linguagem ubíqua do livro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gilsiley Henrique Darú" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["harness_um"]
